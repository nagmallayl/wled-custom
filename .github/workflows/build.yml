name: Build WLED Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout WLED
        uses: actions/checkout@v5
        with:
          repository: wled/WLED
          ref: v16.0.0
          path: WLED

      - name: Checkout custom usermod
        uses: actions/checkout@v5
        with:
          path: custom

      - name: Install custom usermod
        run: |
          mkdir -p WLED/usermods/usermod_passthrough

          cp custom/library.json \
             WLED/usermods/usermod_passthrough/library.json

          cp custom/usermod_passthrough.cpp \
             WLED/usermods/usermod_passthrough/usermod_passthrough.cpp

      - name: Create PlatformIO override
        run: |
          cat > WLED/platformio_override.ini <<'EOF'

          [env:esp32dev_passthrough]
          extends = env:esp32dev

          custom_usermods =
            ${env:esp32dev.custom_usermods}
            usermod_passthrough

          EOF

      - name: Verify custom usermod
        run: |
          echo "===== USERMOD FILES ====="
          ls -la WLED/usermods/usermod_passthrough/

          echo ""
          echo "===== PLATFORMIO OVERRIDE ====="
          cat WLED/platformio_override.ini

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Build WLED
        working-directory: WLED
        run: |
          pio run -e esp32dev_passthrough

      - name: Upload firmware
        uses: actions/upload-artifact@v5
        with:
          name: wled-custom-firmware
          path: WLED/.pio/build/esp32dev_passthrough/*.bin
